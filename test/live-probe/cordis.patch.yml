# Live probe bundle: mounts one row, which drives the surface and exits.
- insert:
    - id: fm-live-probe
      name: 'fm-live-probe'
      config:
        pluginDir: /home/tiao/.dsh/repos/dsh-feishu-mini
        prompt: 'Work through the request briefly, then reply with exactly: PROBE OK'
        steerPrompt: 'Also include the word steered somewhere in your final answer.'
        provider: deepseek-official
        model: deepseek-flash
        timeoutMs: 120000
